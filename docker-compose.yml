services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb,dynamodbstreams

  setup:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "/scripts/setup.sh"]
    volumes:
      - ./scripts:/scripts:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      - localstack
    restart: on-failure

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      setup:
        condition: service_completed_successfully

  processor:
    build: .
    command: ["/processor"]
    volumes:
      - ./schemas:/schemas:ro
      - ./config:/config:ro
    environment:
      SQS_QUEUE_URL: http://localstack:4566/000000000000/events
      DYNAMODB_EVENTS_TABLE: events
      DYNAMODB_QUARANTINE_TABLE: quarantined_events
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SCHEMAS_DIR: /schemas/payloads
      ROUTING_CONFIG: /config/routing.yaml
      PROCESSOR_WORKERS: 5
      SHUTDOWN_GRACE_PERIOD: 30s
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: on-failure
